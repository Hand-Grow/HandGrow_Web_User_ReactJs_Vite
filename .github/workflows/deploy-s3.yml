name: Deploy HandGrow NextJS to S3

on:
  push:
    branches:
      - main # Hoặc nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo code từ repo về máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cài môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Cài thư viện (Nhanh và chuẩn xác hơn npm install)
      - name: Install Dependencies
        run: npm ci

      # 4. Ép đẻ ra thư mục 'out'
      - name: Build Static Export
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        run: npm run build

      # 5. Đeo thẻ nhà báo AWS vào
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Đồng bộ toàn bộ thư mục 'out' lên Bucket, xóa các file cũ rác đi
      - name: Deploy to S3
        run: |
          aws s3 sync ./out s3://${{ secrets.AWS_BUCKET_NAME }} --delete

#
